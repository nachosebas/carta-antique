<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Carta de bebidas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--rojo:#D6433F;--oscuro:#1f1f1f;--tinta:#1c1c1c;--suave:#6b6b6b;--linea:#e6e3e1;--fondo:#fff}
    *{box-sizing:border-box} [hidden]{display:none!important}
    html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:"Open Sans",Arial,Helvetica,sans-serif}
    header{background:var(--oscuro) radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px) 0 0/5px 5px;color:#fff;text-align:center;padding:26px 16px 20px}
    h1{margin:0;font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:500;font-size:clamp(32px,10vw,50px);letter-spacing:.02em;line-height:1.05;text-transform:uppercase}
    .raya{width:min(260px,70%);height:6px;background:var(--rojo);margin:12px auto 0}
    .zonas{background:var(--oscuro);padding:0 12px 16px;text-align:center}
    .zlbl{color:#cfcfcf;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
    .zfila{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    button{font:inherit;cursor:pointer;touch-action:manipulation}
    button:focus-visible{outline:3px solid #1265b0;outline-offset:3px}
    .zbtn{flex:1 1 90px;max-width:170px;font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:18px;color:#fff;background:transparent;border:2px solid #fff;border-radius:4px;padding:9px 10px;min-height:48px}
    .zbtn.activa{background:var(--rojo);border-color:var(--rojo)}
    nav{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--linea);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    .tab{flex:none;font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:15px;color:var(--rojo);background:#fff;border:2px solid var(--rojo);border-radius:4px;padding:6px 14px;min-height:44px}
    .tab.activa{background:var(--rojo);color:#fff}
    main{max-width:560px;margin:0 auto;padding:6px 16px 28px}
    h2{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:26px;margin:22px 0 6px;border-bottom:3px solid var(--rojo);padding-bottom:4px}
    h3{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:16px;color:var(--rojo);margin:18px 0 2px}
    .item{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid var(--linea);font-size:17px}
    .n{font-weight:600;min-width:0;overflow-wrap:anywhere}.p{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;flex-shrink:0}
    .p.conflicto{white-space:normal;max-width:52%;font-size:15px}.oferta{display:block}.origen{font-size:12px;font-weight:400;color:var(--suave)}
    .item.marca{border-bottom:none;padding-bottom:2px}.variantes{color:var(--suave);font-size:15px;padding:0 0 10px;border-bottom:1px solid var(--linea);overflow-wrap:anywhere}
    .pie{text-align:center;color:var(--suave);font-size:12px;padding:10px 16px 24px}
    .estado{text-align:center;color:var(--suave);max-width:420px;margin:0 auto;padding:40px 16px}
    .reintentar{border:2px solid var(--rojo);background:var(--rojo);color:white;border-radius:4px;padding:10px 20px;min-height:48px;margin-top:12px}
    noscript{display:block;text-align:center;padding:30px 16px}
  </style>
  <script src="./carta-completa.js?v=20261112" defer></script>
</head>
<body>
  <header><h1>Carta de bebidas</h1><div class="raya"></div></header>
  <div class="zonas">
    <div class="zlbl">¿Dónde estás?</div>
    <div class="zfila" role="group" aria-label="Elegir zona">
      <button class="zbtn" type="button" data-z="bar" aria-pressed="false">Bar</button>
      <button class="zbtn" type="button" data-z="boliche" aria-pressed="false">Boliche</button>
    </div>
  </div>
  <div id="estado" class="estado" role="status" aria-live="polite"><span id="mensaje">Cargando la carta…</span><br><button id="reintentar" class="reintentar" type="button" hidden>Reintentar</button></div>
  <nav id="categorias" aria-label="Categorías de bebidas" hidden></nav>
  <main id="carta" aria-label="Carta completa" hidden></main>
  <div id="actualizada" class="pie" hidden></div>
  <noscript>Activá JavaScript en tu navegador para ver la carta actualizada.</noscript>
</body>
</html>
